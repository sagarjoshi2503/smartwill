apiVersion: apps/v1
kind: Deployment
metadata:
  name: forwardlegacy-api
  namespace: forwardlegacy-api
spec:
  replicas: 1
  # Recreate (not the RollingUpdate default): the single small cluster node
  # doesn't have spare CPU to run an old+new pod simultaneously during a
  # rollout once 4 services share it. Brief downtime during deploys is
  # acceptable on this dev cluster.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forwardlegacy-api
  template:
    metadata:
      labels:
        app: forwardlegacy-api
    spec:
      containers:
        - name: forwardlegacy-api
          image: smartwillacr.azurecr.io/forwardlegacy-api:latest
          ports:
            - containerPort: 8051
          envFrom:
            - secretRef:
                name: forwardlegacy-secrets
            - configMapRef:
                name: forwardlegacy-api-config
          volumeMounts:
            # Not read by the app directly (it reads env vars), but mounting
            # this CSI volume is what triggers the SecretProviderClass's
            # secretObjects sync into the forwardlegacy-secrets k8s Secret above.
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 400Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8051
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8051
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: smartwill-kv-secrets

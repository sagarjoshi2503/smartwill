apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartwill-api
  namespace: smartwill-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartwill-api
  template:
    metadata:
      labels:
        app: smartwill-api
    spec:
      containers:
        - name: smartwill-api
          image: smartwillacr.azurecr.io/smartwill-api:latest
          ports:
            - containerPort: 8051
          envFrom:
            - secretRef:
                name: smartwill-secrets
            - configMapRef:
                name: smartwill-api-config
          volumeMounts:
            # Not read by the app directly (it reads env vars), but mounting
            # this CSI volume is what triggers the SecretProviderClass's
            # secretObjects sync into the smartwill-secrets k8s Secret above.
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 150m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 400Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8051
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8051
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: smartwill-kv-secrets

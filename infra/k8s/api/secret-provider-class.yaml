apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: smartwill-kv-secrets
  namespace: smartwill-api
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # AKS Secrets Store CSI driver add-on's own managed identity (already
    # granted "Key Vault Secrets User" on smartwill-kv via Terraform).
    userAssignedIdentityID: "4b59791c-145e-4425-ae5b-c062ee00b0bd"
    keyvaultName: "smartwill-kv"
    tenantId: "6414babb-0db4-4846-8b04-2b7ecc906077"
    objects: |
      array:
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: mongodb-uri
          objectType: secret
        - |
          objectName: db-name
          objectType: secret
        - |
          objectName: admin-review-email
          objectType: secret
        - |
          objectName: resend-api-key
          objectType: secret
        - |
          objectName: resend-from-email
          objectType: secret
        - |
          objectName: sendgrid-from-email
          objectType: secret
        - |
          objectName: twilio-account-sid
          objectType: secret
        - |
          objectName: twilio-auth-token
          objectType: secret
        - |
          objectName: twilio-from-number
          objectType: secret
        - |
          objectName: razorpay-key-id
          objectType: secret
        - |
          objectName: razorpay-key-secret
          objectType: secret
        - |
          objectName: vite-google-client-id
          objectType: secret
        - |
          objectName: cors-allow-origins
          objectType: secret
  # Syncs the objects above into a native k8s Secret, remapping each
  # kebab-case Key Vault name back to the SCREAMING_SNAKE_CASE key
  # _app/core/config.py's Settings expects (pydantic-settings matches env
  # vars by name, case-insensitively).
  secretObjects:
    - secretName: smartwill-secrets
      type: Opaque
      data:
        - objectName: jwt-secret-key
          key: JWT_SECRET_KEY
        - objectName: mongodb-uri
          key: MONGODB_URI
        - objectName: db-name
          key: DB_NAME
        - objectName: admin-review-email
          key: ADMIN_REVIEW_EMAIL
        - objectName: resend-api-key
          key: RESEND_API_KEY
        - objectName: resend-from-email
          key: RESEND_FROM_EMAIL
        - objectName: sendgrid-from-email
          key: SENDGRID_FROM_EMAIL
        - objectName: twilio-account-sid
          key: TWILIO_ACCOUNT_SID
        - objectName: twilio-auth-token
          key: TWILIO_AUTH_TOKEN
        - objectName: twilio-from-number
          key: TWILIO_FROM_NUMBER
        - objectName: razorpay-key-id
          key: RAZORPAY_KEY_ID
        - objectName: razorpay-key-secret
          key: RAZORPAY_KEY_SECRET
        - objectName: vite-google-client-id
          key: VITE_GOOGLE_CLIENT_ID
        - objectName: cors-allow-origins
          key: CORS_ALLOW_ORIGINS

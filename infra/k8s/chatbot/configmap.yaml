apiVersion: v1
kind: ConfigMap
metadata:
  name: smartwill-chatbot-config
  namespace: smartwill-chatbot
data:
  # smartwill-mcp isn't deployed to this cluster yet (infra/k8s has no
  # mcp/ manifests) — this assumes the standard in-cluster DNS name it would
  # get once deployed the same way as api/web (Service "smartwill-mcp" in
  # namespace "smartwill-mcp"). Update once that exists.
  MCP_SERVER_URL: "http://smartwill-mcp.smartwill-mcp.svc.cluster.local:8000/mcp"

apiVersion: v1
kind: ConfigMap
metadata:
  name: forwardlegacy-chatbot-config
  namespace: forwardlegacy-chatbot
data:
  # In-cluster DNS to forwardlegacy-mcp's ClusterIP Service (see
  # infra/k8s/mcp/service.yaml) — that Service has no public IP by design.
  # Base URL only — chatbot/mcp_client.py appends the /mcp path itself.
  MCP_SERVER_URL: "http://forwardlegacy-mcp.forwardlegacy-mcp.svc.cluster.local:8000"
  # Same pattern for forwardlegacy-rag's ClusterIP Service (see
  # infra/k8s/rag/service.yaml) — also no public IP by design. Base URL
  # only — chatbot/rag_client.py appends the /search path itself.
  RAG_SERVICE_URL: "http://forwardlegacy-rag.forwardlegacy-rag.svc.cluster.local:8030"
  # forwardlegacy-flags' Service listens on port 80 (see
  # infra/k8s/flags/service.yaml), not 8020 — port 80 is its Service's own
  # `port`, mapped to the container's targetPort 8020 internally.
  FLAGS_SERVICE_URL: "http://forwardlegacy-flags.forwardlegacy-flags.svc.cluster.local"

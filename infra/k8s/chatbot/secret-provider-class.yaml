apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: smartwill-kv-secrets
  namespace: forwardlegacy-chatbot
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # AKS Secrets Store CSI driver add-on's own managed identity (already
    # granted "Key Vault Secrets User" on smartwill-kv via Terraform — see
    # infra/terraform/azure/aks.tf).
    userAssignedIdentityID: "4b59791c-145e-4425-ae5b-c062ee00b0bd"
    keyvaultName: "smartwill-kv"
    tenantId: "6414babb-0db4-4846-8b04-2b7ecc906077"
    objects: |
      array:
        - |
          objectName: anthropic-api-key
          objectType: secret
        - |
          objectName: cors-allow-origins
          objectType: secret
        - |
          objectName: mongodb-uri
          objectType: secret
  secretObjects:
    - secretName: forwardlegacy-chatbot-secrets
      type: Opaque
      data:
        - objectName: anthropic-api-key
          key: ANTHROPIC_API_KEY
        # Same Key Vault secret api/ uses (infra/k8s/api/secret-provider-class.yaml)
        # — currently forwardlegacy-web's LoadBalancer IP, since that's the
        # origin the browser calls both api and chatbot from. Exposed under
        # its own env var name (not CORS_ALLOW_ORIGINS, which api/'s pod
        # uses) even though both pods happen to read the same underlying
        # Key Vault secret value.
        - objectName: cors-allow-origins
          key: CHATBOT_CORS_ALLOW_ORIGINS
        # Same Key Vault object api/'s and rag/'s own secret-provider-class.yaml
        # reference — this pod writes the chatbotresponses feedback
        # collection (see db.py, POST /chat/feedback) into the same MongoDB
        # database, not a copy.
        - objectName: mongodb-uri
          key: MONGODB_URI

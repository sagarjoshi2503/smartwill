apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: smartwill-kv-secrets
  namespace: smartwill-chatbot
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # AKS Secrets Store CSI driver add-on's own managed identity (already
    # granted "Key Vault Secrets User" on smartwill-kv via Terraform — see
    # infra/terraform/azure/aks.tf).
    userAssignedIdentityID: "4b59791c-145e-4425-ae5b-c062ee00b0bd"
    keyvaultName: "smartwill-kv"
    tenantId: "6414babb-0db4-4846-8b04-2b7ecc906077"
    objects: |
      array:
        - |
          objectName: anthropic-api-key
          objectType: secret
  secretObjects:
    - secretName: smartwill-chatbot-secrets
      type: Opaque
      data:
        - objectName: anthropic-api-key
          key: ANTHROPIC_API_KEY

apiVersion: apps/v1
kind: Deployment
metadata:
  name: forwardlegacy-mcp
  namespace: forwardlegacy-mcp
spec:
  replicas: 1
  # Recreate: the single small cluster node doesn't have spare CPU to run
  # an old+new pod simultaneously during a rollout once 4 services share it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forwardlegacy-mcp
  template:
    metadata:
      labels:
        app: forwardlegacy-mcp
    spec:
      containers:
        - name: forwardlegacy-mcp
          image: smartwillacr.azurecr.io/forwardlegacy-mcp:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: forwardlegacy-mcp-config
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              cpu: 400m
              memory: 300Mi
          # No dedicated /healthz, and the streamable-HTTP /mcp endpoint
          # returns 400 on a bare GET (no session) — an httpGet probe would
          # treat that as failing and kill the pod in a loop. A TCP check
          # just confirms uvicorn is accepting connections on the port.
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

apiVersion: v1
kind: Service
metadata:
  name: forwardlegacy-mcp
  namespace: forwardlegacy-mcp
spec:
  # ClusterIP (not LoadBalancer): forwardlegacy-mcp exposes all 21 tools with no
  # auth of its own beyond whatever token a caller supplies — only
  # forwardlegacy-chatbot (which enforces the read-only tool whitelist) should
  # ever reach it. No public IP.
  type: ClusterIP
  selector:
    app: forwardlegacy-mcp
  ports:
    - port: 8000
      targetPort: 8000

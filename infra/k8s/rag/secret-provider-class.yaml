apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: forwardlegacy-rag-secrets
  namespace: forwardlegacy-rag
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # AKS Secrets Store CSI driver add-on's own managed identity (already
    # granted "Key Vault Secrets User" on smartwill-kv via Terraform) — same
    # identity api/'s and mcp's own secret-provider-class.yaml use.
    userAssignedIdentityID: "4b59791c-145e-4425-ae5b-c062ee00b0bd"
    keyvaultName: "smartwill-kv"
    tenantId: "6414babb-0db4-4846-8b04-2b7ecc906077"
    objects: |
      array:
        - |
          objectName: mongodb-uri
          objectType: secret
        - |
          objectName: jwt-secret-key
          objectType: secret
        - |
          objectName: voyage-api-key
          objectType: secret
  # Syncs the objects above into a native k8s Secret. mongodb-uri and
  # jwt-secret-key already exist in Key Vault (api/'s own
  # secret-provider-class.yaml references the same two objects) — this
  # service reads the same values, not a copy, so if either ever rotates
  # both api/ and rag/ pick up the new value on their next pod restart.
  # voyage-api-key is new — must be added to Key Vault before this
  # SecretProviderClass can sync successfully.
  secretObjects:
    - secretName: forwardlegacy-rag-secrets
      type: Opaque
      data:
        - objectName: mongodb-uri
          key: MONGODB_URI
        - objectName: jwt-secret-key
          key: JWT_SECRET_KEY
        - objectName: voyage-api-key
          key: VOYAGE_API_KEY

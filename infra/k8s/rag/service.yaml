apiVersion: v1
kind: Service
metadata:
  name: forwardlegacy-rag
  namespace: forwardlegacy-rag
spec:
  # ClusterIP (not LoadBalancer): forwardlegacy-rag trusts a bearer token it's
  # handed to determine ownership scoping, with no user-facing access
  # control of its own — only forwardlegacy-chatbot should ever reach it, same
  # reasoning as forwardlegacy-mcp (see infra/k8s/mcp/service.yaml). No public IP.
  type: ClusterIP
  selector:
    app: forwardlegacy-rag
  ports:
    - port: 8030
      targetPort: 8030

apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartwill-web
  namespace: smartwill-web
spec:
  replicas: 1
  # Recreate: the single small cluster node doesn't have spare CPU to run
  # an old+new pod simultaneously during a rollout once 5 services share it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smartwill-web
  template:
    metadata:
      labels:
        app: smartwill-web
    spec:
      containers:
        - name: smartwill-web
          image: smartwillacr.azurecr.io/smartwill-web:latest
          ports:
            - containerPort: 5174
          env:
            # Read by nginx at container start (envsubst templating — see
            # web/nginx.conf.template) to proxy the same-origin /api/flags
            # path the frontend always calls to smartwill-flags' in-cluster
            # DNS name — that Service has no public IP by design (see
            # infra/k8s/flags/service.yaml).
            - name: FLAGS_UPSTREAM
              value: "smartwill-flags.smartwill-flags.svc.cluster.local"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 150Mi
          livenessProbe:
            httpGet:
              path: /
              port: 5174
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5174
            initialDelaySeconds: 5
            periodSeconds: 10
